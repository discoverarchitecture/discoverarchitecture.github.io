# Publishes the site/ folder to GitHub Pages on every push to main.
# One-time setup: repo Settings → Pages → Build and deployment → Source: GitHub Actions.
name: Deploy site
on:
  push:
    branches: [main]
    paths: ['site/**', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # Fingerprint the wall's scripts so visitors get a new version at once, not after their cache expires.
      - run: python3 tools/build_pages.py --stamp
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
      # Tell Bing (IndexNow) which pages changed, now that they are live. A manual run sends every page in the sitemap.
      # Never fails the deploy: the log says what happened.
      - name: Tell Bing about changed pages
        continue-on-error: true
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then python3 tools/indexnow.py --all
          else python3 tools/indexnow.py --changed "$BEFORE" "$GITHUB_SHA"; fi
