# Every day, pulls the site's Google Search Console numbers (searches, clicks, which pages Google has indexed) and
# saves them on the `analytics-data` branch in search_console/ (never on main, so it never triggers a site deploy).
# One-time setup: "Search Console data for Claude" in tools/search_console.md (a Google service account key, saved as
# the repository secret GSC_SERVICE_ACCOUNT).
# Check it any time: Actions tab -> "Fetch Search Console" -> Run workflow.
name: Fetch Search Console
on:
  schedule:
    - cron: '37 4 * * *'  # 04:37 UTC, between the analytics runs (07 past every sixth hour)
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: analytics  # shares the analytics-data branch with analytics.yml, so the two never push at once
  cancel-in-progress: false
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Open the analytics-data branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir ../data && cd ../data
          git init -q -b analytics-data
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git fetch -q --depth 1 origin analytics-data; then git reset -q --hard FETCH_HEAD; else echo "First run: the branch will be created."; fi
      - run: pip install -q cryptography
      - name: Fetch from Search Console
        env:
          GSC_SERVICE_ACCOUNT: ${{ secrets.GSC_SERVICE_ACCOUNT }}
        run: python3 tools/fetch_search_console.py --out ../data/search_console
      - name: Save
        run: |
          cd ../data
          git add -A
          if git diff --cached --quiet; then echo "Nothing new."; exit 0; fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -q -m "Search Console for $(date -u +%F)"
          git push -q origin analytics-data
