# Looks up Wikimedia's own resized copies of the wall's photos (tools/photos/resolve.py), so the site can load them from
# Wikimedia instead of storing copies (GitHub Pages' 1 GB limit). Runs when tools/photos/resolve_request.txt changes on a
# claude/photos-* branch, and commits tools/photos/resolved.json and resolve_report.md back.
name: Photo addresses
on:
  push:
    branches: ['claude/photos-*']
    paths: ['tools/photos/resolve_request.txt']
permissions:
  contents: write
jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Look up photo addresses
        run: python3 -u tools/photos/resolve.py
      - name: Commit
        if: always()
        run: |
          git add tools/photos/resolved.json tools/photos/resolve_report.md 2>/dev/null || git add tools/photos/resolved.json || exit 0
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -q -m "Photo addresses looked up on Wikimedia" || exit 0
          git push
